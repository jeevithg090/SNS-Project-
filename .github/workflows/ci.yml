name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest

      - name: Run simulation (build reports)
        run: python src/run_simulation.py --seed 2026 --output-dir "$RUNNER_TEMP/analysis"

      - name: Upload generated reports
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: simulation-reports
          path: ${{ runner.temp }}/analysis

  web:
    name: Web simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test rate-limiter engine
        run: node --test tests/web/*.test.js
